# Two-finger horizontal navigation in the focused Hyprland window.
# libinput-gestures invokes the command directly (no shell parsing).
# Hyprland's sendshortcut sends the key to the active window on Wayland.
gesture swipe left 2 /usr/bin/hyprctl dispatch sendshortcut ALT,LEFT,activewindow
gesture swipe right 2 /usr/bin/hyprctl dispatch sendshortcut ALT,RIGHT,activewindow
